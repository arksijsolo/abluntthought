<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Portal</title>

<style>
* {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    margin: 0;
    background: #f4f6f9;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: #111827;
    color: white;
    height: 100vh;
    padding: 20px;
}

.sidebar h2 {
    font-size: 18px;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: #cbd5e1;
    text-decoration: none;
    margin: 12px 0;
    padding: 10px;
    border-radius: 6px;
}

.sidebar a:hover {
    background: #1f2937;
    color: white;
}

/* MAIN */
.main {
    flex: 1;
    padding: 30px;
}

/* CARD */
.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    margin-bottom: 25px;
}

h3 {
    margin-top: 0;
}

/* FORM */
.form-group {
    margin-bottom: 15px;
}

label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: #555;
    display: block;
    margin-bottom: 6px;
}

input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
}

.btn-primary {
    background: #0d6efd;
    color: white;
}

.btn-danger {
    background: #dc3545;
    color: white;
}

.blog {
    border-bottom: 1px solid #eee;
    padding: 15px 0;
}

.blog h4 {
    margin: 0;
}

.actions {
    margin-top: 10px;
}

.actions form {
    display: inline;
}

/* MOBILE */
@media (max-width: 768px) {
    body {
        flex-direction: column;
    }
    .sidebar {
        width: 100%;
        height: auto;
    }
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Admin Panel</h2>

    <a href="#create">➕ Create Blog</a>
    <a href="#blogs">📄 Manage Blogs</a>
    <a href="/admin/settings">Blog Settings</a>
    <a href="/admin/logout">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <!-- CREATE BLOG -->
    <div class="card" id="create">
        <h3>Create Blog</h3>

        <form method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" required>
            </div>

            <div class="form-group">
                <label>Content</label>
                <textarea name="content" rows="6" required></textarea>
            </div>

            <div class="form-group">
                <label>Image</label>
                <input type="file" name="image">
            </div>

            <button class="btn btn-primary" type="submit">Publish</button>
        </form>
    </div>

    <!-- BLOG LIST -->
    <div class="card" id="blogs">
        <h3>All Blogs</h3>

        {% for blog in blogs %}
        <div class="blog">
            <h4>{{ blog.title }}</h4>
            <p>{{ blog.content[:120] }}...</p>

            {% if blog.image %}
                <img src="{{ blog.image }}" width="120">
            {% endif %}

            <div class="actions">
                <a href="/admin/edit/{{ blog.id }}" class="btn btn-primary">Edit</a>

                <form method="POST" action="/admin/delete/{{ blog.id }}">
                    <button class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
