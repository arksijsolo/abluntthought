<!DOCTYPE html>
<html>
<head>
    <title>Create Blog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>

    <div class="d-flex gap-2">
        <a href="/admin/posts" class="btn btn-outline-light btn-sm">← Back</a>
        <a href="/admin/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container py-4">

    <div class="card shadow-sm p-4">

        <h3 class="mb-4">Create New Blog</h3>

        <form method="POST" enctype="multipart/form-data">

            <!-- TITLE -->
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" placeholder="Enter blog title" required>
            </div>

            <!-- CONTENT -->
            <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea name="content" rows="10" class="form-control" placeholder="Write blog content..." required></textarea>
            </div>

            <!-- IMAGE -->
            <div class="mb-3">
                <label class="form-label">Cover Image</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>

            <!-- BUTTONS -->
            <div class="d-flex justify-content-between">
                <a href="/admin/posts" class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-success">
                    Publish Blog
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
