<!DOCTYPE html>
<html>
<head>
    <title>Manage Posts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>

    <div class="d-flex gap-2">
        <a href="/" class="btn btn-outline-light btn-sm">View Site</a>
        <a href="/admin/dashboard" class="btn btn-secondary btn-sm">← Back to Posts </a>
        <a href="/admin/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container py-4">

    <h3 class="mb-4">Manage Posts</h3>

    {% if blogs %}
    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Title</th>
                    <th>Preview</th>
                    <th width="200">Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for blog in blogs %}
                <tr>
                    <td>{{ blog.title }}</td>

                    <td>{{ blog.content[:80] }}...</td>

                    <td>

                        <!-- VIEW -->
                        <a href="/admin/view/{{ blog.id }}"
                           class="btn btn-info btn-sm">
                            View
                        </a>

                        <!-- EDIT -->
                        <a href="/admin/edit/{{ blog.id }}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <!-- DELETE -->
                        <a href="/admin/delete/{{ blog.id }}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this post?')">
                            Delete
                        </a>

                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>
    {% else %}
        <p class="text-muted">No posts found.</p>
    {% endif %}

</div>

</body>
</html>
