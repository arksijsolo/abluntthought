<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Admin</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start; min-vh: 100vh; }
        
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 600px; }
        h3 { margin-top: 0; margin-bottom: 25px; font-size: 22px; color: #212529; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        input:focus { border-color: #0d6efd; outline: none; }
        
        .btn-group { display: flex; justify-content: space-between; margin-top: 25px; gap: 15px; }
        .btn { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 14px; text-align: center; }
        .btn-save { background: #dc3545; color: white; }
        .btn-save:hover { background: #bd2130; }
        .btn-cancel { background: #6c757d; color: white; }
        
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 14px; font-weight: 500; }
        .alert-danger { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
    </style>
</head>
<body>

<div class="card">
    <h3>Update Admin Password</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/admin/reset-password" method="POST">
        <div class="form-group">
            <label>Confirm Current Password</label>
            <input type="password" name="current_password" placeholder="••••••••" required>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">
        <div class="form-group">
            <label>New Secure Password</label>
            <input type="password" name="new_password" placeholder="Minimum 8 characters recommended" required>
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" placeholder="Retype new password" required>
        </div>
        
        <div class="btn-group">
            <a href="/admin/blogs" class="btn btn-cancel">Back to Dashboard</a>
            <button type="submit" class="btn btn-save">Update Credentials</button>
        </div>
    </form>
</div>

</body>
</html>
