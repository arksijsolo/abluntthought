<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">

    <!-- LEFT SIDE -->
    <a class="navbar-brand" href="#">Admin Panel</a>

    <!-- RIGHT SIDE -->
<div class="ms-auto d-flex gap-2">

    <!-- Visit Site -->
    <a href="/" class="btn btn-outline-light btn-sm">
        Visit Site
    </a>

    <!-- Change Password -->
    <a href="/admin/change-password" class="btn btn-outline-warning btn-sm">
        Change Password
    </a>

    <!-- Logout -->
    <a href="/admin/logout" class="btn btn-danger btn-sm">
        Logout
    </a>

</div>

</nav>

<div class="container py-4">

    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="row">

        <!-- SETTINGS CARD -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    Blog Settings
                </div>

                <div class="card-body">
                    <form method="POST">
                        <label class="form-label">Posts per page</label>
                        <input type="number"
                               class="form-control"
                               name="posts_per_page"
                               value="{{ posts_per_page }}"
                               min="1"
                               max="50">

                        <button class="btn btn-primary mt-3 w-100">
                            Save Settings
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- FUTURE FEATURES -->
        <div class="col-md-6 mt-4 mt-md-0">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    Quick Actions
                </div>

                <div class="card-body">
                    <a href="/admin/posts" class="btn btn-outline-primary w-100 mb-2">
                        Manage Posts
                    </a>

                    <a href="/admin/blogs/create" class="btn btn-outline-success w-100 mb-2">
                        Create New Post
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
