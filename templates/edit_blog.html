<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start; min-vh: 100vh; }
        
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 1400px; }
        
        h3 { margin-top: 0; margin-bottom: 25px; font-size: 22px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; color: #555; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 25px; }
        .btn { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 14px; }
        .btn-save { background: #0d6efd; color: white; }
        .btn-cancel { background: #6c757d; color: white; }

        @media (max-width: 576px) {
            body { padding: 20px 10px; }
            .card { padding: 20px; }
            .btn-group { flex-direction: column-reverse; gap: 10px; }
            .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

<div class="card">
    <h3>Modify Blog Entry</h3>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" value="{{ blog.title }}" required>
        </div>
        <div class="form-group">
            <label>Update Cover Image (Leave blank to keep current)</label>
            <input type="file" name="image" accept="image/*" style="border: none; padding: 5px 0;">
        </div>
        <div class="form-group">
            <label>Content</label>
            <textarea name="content" rows="12" required>{{ blog.content }}</textarea>
        </div>
        <div class="btn-group">
            <a href="/admin/blogs" class="btn btn-cancel">Cancel</a>
            <button type="submit" class="btn btn-save">Save Changes</button>
        </div>
    </form>
</div>

</body>
</html>
