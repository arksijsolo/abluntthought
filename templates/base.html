<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}abluntthought{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="{{ url_for('home') }}" class="logo">Abluntthought</a>
      <div class="nav-links">
        <a href="{{ url_for('home') }}" class="{{ 'active' if active == 'home' }}">Home</a>
        <a href="{{ url_for('about') }}" class="{{ 'active' if active == 'about' }}">About</a>
        <a href="{{ url_for('contact') }}" class="{{ 'active' if active == 'contact' }}">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>&copy; 2026 MySite. Built with Flask.</p>
  </footer>
</body>
</html>
