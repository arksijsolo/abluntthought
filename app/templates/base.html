<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}A Blunt Thought{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    
    <style>
        /* Sticky Footer Setup */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        main {
            flex: 1;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white" href="/">
                <i class="bi bi-journal-text me-2 text-success"></i>A Blunt Thought
            </a>
            <button class="navbar-expand-lg navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/posts"><i class="bi bi-file-earmark-richtext me-1"></i>Articles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about"><i class="bi bi-person me-1"></i>About</a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center gap-2">
                    <a href="/admin" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                    <a href="/logout" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-secondary pt-4 pb-2 border-top border-secondary mt-auto">
        <div class="container">
            <div class="row align-items-center gy-3">
                <div class="col-md-4 text-center text-md-start">
                    <h5 class="text-white mb-1">A Blunt Thought</h5>
                    <p class="small mb-0">Raw insights, structural code, and candid layout concepts.</p>
                </div>
                
                <div class="col-md-4 text-center">
                    <a href="/" class="text-secondary text-decoration-none mx-2 small">Home</a>
                    <a href="/about" class="text-secondary text-decoration-none mx-2 small">About</a>
                    <a href="/privacy" class="text-secondary text-decoration-none mx-2 small">Privacy Policy</a>
                </div>
                
                <div class="col-md-4 text-center text-md-end">
                    <a href="https://github.com" target="_blank" class="text-secondary mx-2 fs-5"><i class="bi bi-github"></i></a>
                    <a href="https://youtube.com" target="_blank" class="text-secondary mx-2 fs-5"><i class="bi bi-youtube"></i></a>
                    <a href="https://linkedin.com" target="_blank" class="text-secondary mx-2 fs-5"><i class="bi bi-linkedin"></i></a>
                </div>
            </div>
            
            <hr class="border-secondary my-3">
            
            <div class="row">
                <div class="col text-center">
                    <p class="small mb-0">&copy; 2026 A Blunt Thought. All Rights Reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
</body>
</html>
